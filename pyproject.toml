[project]
name = "dd2-mcp"
version = "0.1.0"
description = "Dragon's Dogma 2 modding MCP server: REFramework live Lua eval, introspection, deploy, save snapshots"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "capstone>=5", "zstandard>=0.22", "pillow>=10"]

[project.scripts]
dd2-mcp = "dd2mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dd2mcp"]
